- type: entity
  id: ShadekinTrap
  parent: BaseShadow
  name: dark trap
  placement:
    mode: SnapgridCenter
  components:
    - type: Physics
      fixedRotation: true
    - type: Transform
      anchored: true
    - type: Fixtures
      fixtures:
        floortrap:
          shape: !type:PhysShapeAabb
            bounds: "-0.2,-0.2,0.2,0.2"
          hard: false
          mask:
            - ItemMask
          layer:
            - SlipLayer
    - type: Sprite
      noRot: true
      sprite: _Starlight/Structures/Specific/Anomalies/dark.rsi
      layers:
        - state: darktrap
    - type: TriggerOnCollide
      fixtureID: floortrap
      maxTriggers: 1
    # Whiskey: a lista branca saiu do TriggerOnCollide e virou componente de
    # condicao proprio, o WhitelistTriggerCondition, com os campos userWhitelist
    # e userBlacklist.
    - type: WhitelistTriggerCondition
      userWhitelist:
        components:
          - MobState
      userBlacklist:
        components:
          - Brighteye
    - type: DarkTrap
    - type: SpawnOnTrigger
      proto: ShadekinTrapTrigger
    - type: DeleteOnTrigger
    - type: Tag
      tags:
        - HideContextMenu

- type: entity
  id: ShadekinTrapTrigger
  parent: ShadekinTrapSpawn
  categories: [HideSpawnMenu]
  components:
    - type: Sprite
      sprite: _Starlight/Structures/Specific/Anomalies/dark.rsi
      noRot: true
      layers:
        - state: darktrap-active
          shader: unshaded
    - type: TimedDespawn
      lifetime: 0.7
