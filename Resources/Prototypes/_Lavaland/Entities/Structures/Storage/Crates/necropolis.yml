- type: entity
  parent: CrateGenericSteel
  id: LavalandCrateNecropolis
  name: necropolis chest
  description: Steel and strong.
  components:
  - type: Icon
    sprite: _Lavaland/Structures/Storage/Crates/necropolechest.rsi
  - type: Sprite
    sprite: _Lavaland/Structures/Storage/Crates/necropolechest.rsi

- type: entity
  parent: LavalandCrateNecropolis
  id: LavalandCrateNecropolisFilled
  name: necropolis chest
  suffix: Filled
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: NecropolisChestLoot

- type: entityTable
  id: NecropolisChestLoot
  table: !type:GroupSelector
    children:
    - id: LavalandCursedHeart
    - id: ClothingOuterArmorCult
    # TODO add more interesting obtain methods for crusher upgrades (from megafauna, ruins, etc.)
    - id: CrusherUpgradeMainRudeBuster
    - id: ChemistryBottleStabilizingSerum

    - !type:NestedSelector
      tableId: NecropolisKineticModkitLoot

    - !type:NestedSelector
      weight: 2
      tableId: LavalandMaterialRare
    - !type:AllSelector
      children:
      - id: ClothingOuterRobesCult
      - id: BedsheetCult

- type: entityTable
  id: NecropolisKineticModkitLoot
  table: !type:GroupSelector
    children:
    - id: PKAUpgradeHybridAoE
    - id: PKAUpgradeRapidRepeater
    - id: PKAUpgradeResonatorBlast
    - id: PKAUpgradeDeathSyphon
    - id: LavalandVampirismCrystal

- type: entityTable
  id: LavalandMaterialRare
  table: !type:GroupSelector
    children:
    - !type:GroupSelector
      children:
      - id: MaterialWatcherWing5
      - id: MaterialWatcherMagmaWing5
      - id: MaterialWatcherIceWing5
    - !type:AllSelector
      rolls: 1, 2
      children:
      - id: MaterialLegionSkull1
      - id: MaterialBones1
        rolls: 2, 3

- type: entity
  parent: LavalandCrateNecropolis
  id: LavalandCrateNecropolisBloodDrunkMinerFilled
  suffix: Blood-drunk Miner rewards
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: WeaponCleavingSaw
        - id: WeaponBloodDrunkKineticAccelerator

- type: entity
  parent: LavalandCrateNecropolis
  id: LavalandCrateNecropolisDemonicFrostMinerFilled
  suffix: Demonic Frost Miner rewards
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:GroupSelector
        children:
        - id: DemonicResurrectionCrystal
        - id: ClothingShoesBootsCursedIce
        - id: WeaponDemonicJackhammer
