# SPDX-License-Identifier: AGPL-3.0-or-later
# Prototype behavior adapted to Whiskey's current MODsuit framework from Goobstation PR #6542.

- type: entity
  parent: ClothingModsuitStandard
  id: ClothingModsuitMercuryRadiant
  components:
  - type: Sprite
    sprite: _Lavaland/Clothing/Back/Modsuits/radiant.rsi
  - type: ToggleableClothing
    clothingPrototypes:
      head: ClothingModsuitHelmetMercuryRadiant
      gloves: ClothingModsuitGauntletsMercuryRadiant
      outerClothing: ClothingModsuitChestplateMercuryRadiant
      shoes: ClothingModsuitBootsMercuryRadiant
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMicroreactor
        whitelist:
          components: [ PowerCell ]
  - type: Storage
    grid:
    - 0,0,10,3
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      back:
      - state: equipped-BACKPACK-sealed
  - type: Construction
    graph: SpiderMercuryRadiantModsuitConstructionGraph
    node: radiantModsuit

- type: entity
  parent: ClothingModsuitGauntletsStandard
  id: ClothingModsuitGauntletsMercuryRadiant
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Lavaland/Clothing/Hands/ModSuits/radiant.rsi
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      gloves:
      - state: equipped-HAND-sealed
  - type: Insulated

- type: entity
  parent: ClothingModsuitHelmetStandard
  id: ClothingModsuitHelmetMercuryRadiant
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Lavaland/Clothing/Head/Modsuits/radiant.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.8
      OrganDamage: 0.75
      BoneDamage: 0.75
      VeinsDamage: 0.2
      NerveDamage: 0.1
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.6
        Heat: 0.5
        Radiation: 0
        Caustic: 0.75
  - type: FlashImmunity
  - type: FlashSoundSuppression
    protectionRange: 3
  - type: EyeProtection
  - type: ShowHealthBars
    damageContainers: [ Biological, Inorganic, Silicon ]
  - type: PointLight
    color: "#ffdf00"
    radius: 8
    energy: 2
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      head:
      - state: equipped-HEAD-sealed

- type: entity
  parent: ClothingModsuitChestplateStandard
  id: ClothingModsuitChestplateMercuryRadiant
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Lavaland/Clothing/OuterClothing/MODsuits/Radiant/radiant.rsi
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.75
      OrganDamage: 0.75
      BoneDamage: 0.75
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.65
        Piercing: 0.65
        Heat: 0.7
        Radiation: 0
        Caustic: 0.5
  - type: ExplosionResistance
    damageCoefficient: 0.8
  - type: StaminaResistance
    damageCoefficient: 0.75
  - type: PreventChasmFalling
    deleteOnUse: false
  - type: ClothingGrantComponent
    component:
    - type: SupermatterImmune
    - type: EventHorizonIgnore
      horizonWhitelist:
        tags: [ Tesla ]
    - type: ContainmentFieldIgnore
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING-sealed

- type: entity
  parent: ClothingModsuitBootsStandard
  id: ClothingModsuitBootsMercuryRadiant
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Lavaland/Clothing/Shoes/MODsuits/radiant.rsi
  - type: Tag
    tags: [ WhitelistChameleon ]
  - type: ItemToggle
  - type: ToggleClothing
    action: ActionToggleMagboots
  - type: ComponentToggler
    components:
    - type: NoSlip
  - type: Magboots
    enabledPrefix: null
  - type: ClothingSpeedModifier
    walkModifier: 1.15
    sprintModifier: 1.15
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      shoes:
      - state: equipped-FEET-sealed
