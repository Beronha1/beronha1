# Childish Oni mechanics adapted from Goobstation PR #6734.

- type: entity
  id: MobChildishOni
  parent: LavalandMobBase
  name: childish oni
  description: An oni from the demonic capital, eager to turn battle into a cruel game.
  components:
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.35,-0.6,0.35,0.6"
        density: 10000
        mask: [ MobMask ]
        layer: [ MobLayer ]
  - type: Sprite
    drawdepth: Mobs
    sprite: _Lavaland/Mobs/Bosses/banana.rsi
    noRot: true
    layers:
    - map: [ "oni" ]
      state: phase_0
  - type: Clickable
  - type: InteractionOutline
  - type: InputMover
  - type: MobMover
  - type: Actions
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ChildishOniVisuals.Phase:
        oni:
          Phase0: { state: phase_0 }
          Phase1: { state: phase_1 }
          Phase2: { state: phase_2 }
          Phase3: { state: phase_3 }
  - type: CombatMode
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 3
  - type: MobThresholds
    thresholds:
      0: Alive
      2600: Dead
  - type: Damageable
    damageModifierSet: Hierophant
  - type: Injurable
    damageContainer: Inorganic
  - type: NpcFactionMember
    factions: [ SimpleHostile ]
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: MeleeWeapon
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 10
        Piercing: 5
  - type: DamageOnCollide
    ignoreWhitelist:
      components: [ Fauna ]
    inverted: true
    damage:
      types:
        Structural: 1000
  - type: ActionGrant
    actions:
    - ActionChildishOniDemonicHandSpiral
    - ActionChildishOniRampage
    - ActionChildishOniRingClose
    - ActionChildishOniRingWide
    - ActionChildishOniClawSlash
    - ActionChildishOniFlurry
    - ActionChildishOniHandSide
    - ActionChildishOniHandBarrage
    - ActionChildishOniFlamingSlash
  - type: Fauna
  - type: Anger
    totalHp: 2600
  - type: Aggressive
    forgiveRange: 25
  - type: MobPhases
    phaseThresholds:
      0: 1
      1: 2
      700: 3
      1600: 4
  - type: MegafaunaPhaseDialogue
    minimumInterval: 12
    maximumInterval: 22
    phases:
      1:
        lines: [ oni-idle-1, oni-idle-2, oni-idle-3, oni-idle-4, oni-idle-5, oni-idle-6, oni-idle-7 ]
      2:
        transitionLine: oni-change-1
        lines: [ oni-taunt-1, oni-taunt-2, oni-taunt-3, oni-taunt-4, oni-taunt-5, oni-taunt-6, oni-taunt-7, oni-taunt-8 ]
      3:
        transitionLine: oni-change-2
        lines: [ oni-rage-1, oni-rage-2, oni-rage-3, oni-rage-4, oni-rage-5, oni-rage-6, oni-rage-7 ]
      4:
        transitionLine: oni-change-3
        lines: [ oni-true-1, oni-true-2, oni-true-3, oni-true-4, oni-true-5, oni-true-6, oni-true-7, oni-true-8, oni-true-9 ]
  - type: BossMusic
    soundId: ChildishOni
  - type: MegafaunaHarvestable
    completionCarcass: ChildishOniResidualCarcass
    stages:
    - name: megafauna-harvest-stage-oni-stomach
      toolQualities: [ Slicing ]
      duration: 10
      loot: !type:AllSelector
        children:
        - id: DrinkOniGourd
    - name: megafauna-harvest-stage-oni-density-core
      toolQualities: [ Sawing ]
      duration: 14
      loot: !type:AllSelector
        children:
        - id: OniDensityCore
  - type: SpawnLootOnDeath
    deleteOnDeath: true
    dropBoth: true
    table: !type:AllSelector
      children:
      - id: LavalandCrateNecropolisFilled
      - id: WeaponChildishOniBlade
      - id: ClothingOuterChildishOniFloweryDress
      - id: ClothingHandsChildishOniCursed
      - id: ClothingShoesChildishOniCursed
      - id: ClothingBeltChildishOniObi
      - id: ClothingHeadChildishOniZukin
    specialTable: !type:AllSelector
      children:
      - id: TrophyChildishOniHorn
    weaponWhitelist:
      components: [ MegafaunaWeaponLooter ]
  - type: MegafaunaAi
    actionDelay: 0.5
    selector:
      id: ChildishOni
  - type: MegafaunaFieldGenerator
    wallId: WallChildishOniMagmaTemporary
    wallShape: !type:NestedEntityShape
      id: BoxHollow
      size: 11
  - type: MegafaunaAnchor
  - type: MegafaunaGodmode
  - type: MegafaunaRejuvenate
  - type: MegafaunaDirector
  - type: MegafaunaSpecialAttackOnly
  - type: ChildishOni
    landingDamage:
      types:
        Blunt: 1
        Heat: 1
