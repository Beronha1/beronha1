- type: entity
  id: RapidBulletKinetic # Used for PK repeater and pistol
  name: rapid kinetic bolt
  parent: BulletKinetic
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Blunt: 4
  - type: TimedDespawn
    lifetime: 0.22 # roughly 5.5 tiles

- type: entity
  id: WeakBulletKinetic # Used for PK shotgun
  categories: [ HideSpawnMenu ]
  parent: RapidBulletKinetic
  components:
  - type: Projectile
    damage:
      types:
        Blunt: 4

- type: entity
  id: PelletKinetic
  categories: [ HideSpawnMenu ]
  parent: WeakBulletKinetic
  components:
  - type: GatheringProjectile
    probability: 0.5

- type: entity
  id: PelletKineticSpread
  categories: [ HideSpawnMenu ]
  parent: PelletKinetic
  components:
  - type: ProjectileSpread
    proto: PelletKinetic
    count: 4
    spread: 20

- type: entity
  id: BulletKineticRailgun
  name: hyper-kinetic bolt
  parent: BulletKinetic
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Blunt: 20
        Structural: 25
  - type: KineticMobPenetrationProjectile
  - type: TimedDespawn
    lifetime: 0.2

- type: entity
  id: BulletKineticShockwave
  name: concussive kinetic bolt
  parent: BulletKinetic
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.06

- type: entity
  id: BulletKineticShockwaveSpread
  parent: BulletKineticShockwave
  categories: [ HideSpawnMenu ]
  components:
  - type: ProjectileSpread
    proto: BulletKineticShockwave
    count: 8
    spread: 315
