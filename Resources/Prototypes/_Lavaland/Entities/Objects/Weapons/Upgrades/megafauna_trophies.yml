# Mechanics and original trophy sprites ported from RedStar PR #117.

- type: entity
  parent: BaseCrusherUpgradeHandle
  id: TrophyLavalandLegionSkull
  name: legion skull
  description: Increases kinetic attack speed. Ranged hits charge a single explosive legion skull; a marked melee kill can raise one non-boss fauna.
  components:
  - type: Sprite
    sprite: _Wega/Objects/Specific/Lavaland/trophies.rsi
    state: skull
  - type: GunUpgrade
    name: lavaland-trophy-legion-name
    uniqueGroup: legionTrophy
    pipelinePriority: 30
  - type: CrusherLegionSkullUpgrade
  - type: CrusherTrophy
    trophyId: legion
    capacityCost: 50
  - type: TrophyRecyclable
    loot: !type:AllSelector
      children:
      - id: MaterialLegionSkull1
  - type: WeaponUpgradeSpeed
    attackRateMultiplier: 1.15

- type: entity
  parent: BaseCrusherUpgradeHandle
  id: TrophyLavalandBDMEye
  name: eye of the blood-drunk miner
  description: Makes a crusher lighter, grants brief control immunity after consuming a marker and lets kinetic bolts steal a small amount of life.
  components:
  - type: Sprite
    sprite: _Wega/Objects/Specific/Lavaland/trophies.rsi
    state: eye
  - type: GunUpgrade
    name: lavaland-trophy-bdm-name
    uniqueGroup: bdmTrophy
    pipelinePriority: 40
  - type: CrusherEyeBloodDrunkMinerUpgrade
    rangedHeal:
      types:
        Blunt: -2
        Heat: -1
        Asphyxiation: -1
  - type: CrusherTrophy
    trophyId: blood-drunk-miner
    capacityCost: 30
  - type: TrophyRecyclable
    loot: !type:AllSelector
      children:
      - id: MaterialHighDensityCircuit1
      - id: MaterialTitaniumAlloy1
  - type: WeaponUpgradeSpeed
    attackRateMultiplier: 1.25

- type: entity
  parent: BaseCrusherUpgradeBlade
  id: TrophyLavalandAshDrakeSpike
  name: ash drake spike
  description: Consuming a marker creates a fiery blast. Kinetic bolts deal heat damage, knock targets back and periodically erupt on impact.
  components:
  - type: Sprite
    sprite: _Wega/Objects/Specific/Lavaland/trophies.rsi
    state: spike
  - type: GunUpgrade
    name: lavaland-trophy-ash-drake-name
    uniqueGroup: ashDrakeTrophy
    pipelinePriority: 20
  - type: CrusherAshDrakeSpikeUpgrade
  - type: CrusherTrophy
    trophyId: ash-drake
    capacityCost: 25
  - type: TrophyRecyclable
    loot: !type:AllSelector
      children:
      - id: MaterialDragonBone1
        rolls: 2
  - type: WeaponUpgradeDamage
    bonusDamage:
      types:
        Heat: 8
  - type: GunUpgradeDamage
    bonusDamage:
      types:
        Heat: 8

- type: entity
  parent: BaseCrusherUpgradeBlade
  id: TrophyLavalandBubblegumDemonClaws
  name: demon claws
  description: Increases melee damage and life-steal. On a PKA it splits each bolt into a three-projectile blast and heals on living hits.
  components:
  - type: Sprite
    sprite: _Wega/Objects/Specific/Lavaland/trophies.rsi
    state: claws
  - type: GunUpgrade
    name: lavaland-trophy-bubblegum-name
    uniqueGroup: bubblegumTrophy
    pipelinePriority: 0
  - type: CrusherDemonClawsUpgrade
    meleeHeal:
      types:
        Blunt: -0.75
    rangedHeal:
      types:
        Blunt: -1
        Heat: -1
  - type: CrusherTrophy
    trophyId: bubblegum
    capacityCost: 40
  - type: TrophyRecyclable
    loot: !type:AllSelector
      children:
      - id: ChemistryBottleDemonicBlood
  - type: GunUpgradeComponents
    components:
    - type: LeechOnMarker
      leech:
        types:
          Blunt: -5

- type: entity
  parent: BaseCrusherUpgradeBlade
  id: TrophyLavalandColossusBlasterTubes
  name: colossus blaster tubes
  description: Creates geometric melee shockwaves. Kinetic bolts travel faster and valid impacts shorten the weapon's recharge.
  components:
  - type: Sprite
    sprite: _Wega/Objects/Specific/Lavaland/trophies.rsi
    layers:
    - state: tubes
  - type: GunUpgrade
    name: lavaland-trophy-colossus-name
    uniqueGroup: colossusTrophy
    pipelinePriority: 30
  - type: CrusherBlasterTubesUpgrade
    damage:
      types:
        Blunt: 10
    projectileSpeedCoefficient: 1.25
  - type: CrusherTrophy
    trophyId: colossus
    capacityCost: 50
  - type: TrophyRecyclable
    loot: !type:AllSelector
      children:
      - id: MaterialNecroAlloy1
        rolls: 2
  - type: GunUpgradeDamage
    modifier: 1.2
