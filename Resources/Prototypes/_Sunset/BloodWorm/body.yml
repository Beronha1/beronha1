# 🌇Sunset🌇 - minimal body for blood worm so it can vent-crawl. VentCrawlSystem's TryInsert requires
# the entity to have either an ItemComponent or a BodyComponent (see
# SharedVentCrawlSystem.Helpers.CanInsert) - blood worm had neither, so using the "Climb" verb on a
# vent silently did nothing (the DoAfter completed but insertion always failed). No organs on
# purpose: blood worm doesn't eat/breathe/bleed through the organ system (it uses its own BloodWorm
# component for leeching/healing), so there's nothing else it needs from a body besides satisfying
# that check - a bare torso reusing the existing TorsoAnimal part is enough, and also keeps it clear
# of the eyes-organ blindness check in ChildBlockVisionSystem (no organs at all -> exempt).

- type: body
  id: BloodWorm
  name: "blood worm"
  root: torso
  slots:
    torso:
      part: TorsoAnimal
