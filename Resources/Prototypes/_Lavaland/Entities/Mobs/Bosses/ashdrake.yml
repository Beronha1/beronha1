- type: entity
  parent: [ LavalandMobBase, BaseSlicingRefinable ]
  id: LavalandBossAshDrake
  name: ash drake
  description: Guardian of the Necropolis.
  components:
  - type: Physics
    bodyType: KinematicController
  - type: Clickable
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1,-1,1,1"
        density: 1000
        mask:
        - LargeMobMask
        layer:
        - LargeMobLayer
  - type: NpcFactionMember
    factions:
    - Lavafauna
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      NavSmash: !type:Bool
        true
  - type: Sprite
    drawdepth: Mobs
    sprite: _Wega/Mobs/Lavaland/ashdrake.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: dragon
  - type: DamageStateVisuals
    states:
      Alive:
        Base: dragon
      Dead:
        Base: dragon_dead
  - type: BasicEntityAmmoProvider
    proto: BulletAshDrakeFire
    capacity: 9999
    count: 9999
  - type: Gun
    projectileSpeed: 10
    fireRate: 10
    useKey: false
    soundGunshot: null
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    damage:
      types:
        Slash: 20
        Structural: 150
  - type: Tag
    tags:
    - CannotSuicide
  - type: CombatMode
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 3
  - type: MobThresholds
    thresholds:
      0: Alive
      2500: Dead
  - type: ToolRefinable
    refineResult:
    - id: FireballSpellbook
  - type: Damageable
    damageModifierSet: Hierophant
  - type: Injurable
    damageContainer: Inorganic
  - type: TileMovement
  - type: BossMusic
    soundId: AshDrake
  - type: Aggressive # also required component for aggro checking
    forgiveRange: 20.0
  - type: MegafaunaDirector
  - type: AshDrakeBoss
  - type: SpawnLootOnDeath
    deleteOnDeath: true
    dropBoth: true
    table: !type:AllSelector
      children:
      - id: LavalandCrateNecropolisAshDrakeFilled
    specialTable: !type:AllSelector
      children:
      - id: TrophyLavalandAshDrakeSpike
    weaponWhitelist:
      components:
      - MegafaunaWeaponLooter
  - type: NPCUseActionsOnTarget
    delayModifier: 0.5
    actionIds:
    - ActionAshDrakeConeFire
    - ActionAshDrakeBreathingFire
    - ActionAshDrakeLava
    actionChances:
      ActionAshDrakeConeFire: 0.75
      ActionAshDrakeBreathingFire: 0.6
      ActionAshDrakeLava: 0.1
