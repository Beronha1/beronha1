- type: entity
  parent: DrinkBottlePlasticBaseFull
  id: JugCocoa
  name: cocoa powder jug
  suffix: For Drinks, Full
  description: A jug of cocoa powder.
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 150
        reagents:
        - ReagentId: CocoaPowder
          Quantity: 150
  - type: Edible
  - type: Label
    currentLabel: reagent-name-cocoapowder

- type: entity
  parent: DrinkBaseCup
  id: DrinkDisposableCup
  name: disposable cup
  components:
  - type: PhysicalComposition
    materialComposition:
      Cardboard: 10 # Whiskey - era 25, mais do que o custo de 13 numa lathe melhorada (arbitragem de material)
  - type: ExaminableSolution
    solution: drink
  - type: Sprite
    sprite: _Impstation/Objects/Consumable/Drinks/coffeecup.rsi
    state: icon
  - type: Appearance
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
