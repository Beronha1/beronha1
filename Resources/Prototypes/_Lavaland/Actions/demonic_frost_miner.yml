- type: entity
  parent: BaseAction
  id: ActionDemonicFrostOrbs
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    raiseOnUser: true
    useDelay: 4
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles_tg.rsi
    layers:
    - state: ice
  - type: TargetAction
    range: 18
  - type: EntityTargetAction
    event: !type:DemonicFrostOrbActionEvent

- type: entity
  parent: ActionDemonicFrostOrbs
  id: ActionDemonicFrostMachineGun
  components:
  - type: Action
    useDelay: 6
  - type: EntityTargetAction
    event: !type:DemonicFrostMachineGunActionEvent

- type: entity
  parent: ActionDemonicFrostOrbs
  id: ActionDemonicFrostShotgun
  components:
  - type: Action
    useDelay: 5
  - type: EntityTargetAction
    event: !type:DemonicFrostShotgunActionEvent
