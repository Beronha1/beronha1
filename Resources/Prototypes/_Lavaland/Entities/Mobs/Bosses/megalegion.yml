- type: entity
  abstract: true
  name: Legion
  id: BaseLavalandBossMegaLegion
  parent: LavalandMobBase
  description: One of many.
  components:
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/_Lavaland/Mobs/legion_spawn.ogg
      params:
          volume: 5
          maxDistance: 30
  - type: Physics
    bodyType: KinematicController
  - type: Clickable
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 1000
        mask:
        - LargeMobMask
        layer:
        - LargeMobLayer
  - type: NpcFactionMember
    factions:
    - Lavafauna
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      NavSmash: !type:Bool
        true
  - type: Sprite
    drawdepth: Mobs
    sprite: _Lavaland/Mobs/Bosses/96x96.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: mega_legion
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    soundHit:
      collection: AlienClaw
    animation: WeaponArcBite
    damage:
        types:
          Blunt: 35
          Structural: 200
  - type: Tag
    tags:
    - CannotSuicide
  - type: CombatMode
  - type: MovementSpeedModifier
    baseWalkSpeed: 5
    baseSprintSpeed: 5
  - type: MobThresholds
    thresholds:
      0: Alive
      800: Dead
  - type: Damageable
    damageModifierSet: Hierophant
  - type: Injurable
    damageContainer: Inorganic
  - type: TileMovement
  - type: BossMusic
    soundId: AshDrake
  - type: Aggressive # also required component for aggro checking
    forgiveRange: 20.0
  - type: LegionBoss
    summonCount: 3
    lootPrototypes:
      MaterialBones1: 1
      LavalandCrateNecropolisFilled: 0.2
      LegionCore: 0.1
    rewards:
    - CrowbarRed
  - type: NPCUseActionsOnTarget
    actionIds:
    - ActionMegaLegion

- type: entity
  parent: BaseLavalandBossMegaLegion
  id: LavalandBossMegaLegion
  name: Legion
  components:
  - type: MegafaunaDirector
  - type: LegionBoss
    lootPrototypes:
      MaterialBones: 1
      LavalandCrateNecropolisFilled: 0.2
      LegionCore: 0.1
  - type: SpawnLootOnDeath
    deleteOnDeath: true
    specialTable: !type:AllSelector
      children:
      - id: TrophyLavalandLegionSkull
    weaponWhitelist:
      components:
      - MegafaunaWeaponLooter
