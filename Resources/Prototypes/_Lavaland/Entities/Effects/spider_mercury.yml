- type: entity
  parent: EffectAshDrakeFireWall
  id: SpiderMercuryHazard
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Lavaland/Effects/plankton.rsi
    state: plankton_explode
    drawdepth: Effects
  - type: TimedDespawn
    lifetime: 4
  - type: DamageOnTrigger
    targetUser: true
    damage:
      types:
        Heat: 8
        Radiation: 4
  - type: DamageOnTriggerBlacklist
