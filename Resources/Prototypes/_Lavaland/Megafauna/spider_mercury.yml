# Selector topology and cadence from Goobstation PR #6542.

- type: megafaunaSelector
  id: Mercury
  selector: !type:AllMegafaunaSelector
    children: [ { id: PickTargetSimple }, { id: MercuryActions } ]

- type: megafaunaSelector
  id: UFO
  selector: !type:AllMegafaunaSelector
    children: [ { id: PickTargetSimple }, { id: UFOActions } ]

- type: megafaunaSelector
  id: ORTMelee
  selector: !type:AllMegafaunaSelector
    children: [ { id: PickTargetSimple }, { id: ORTMeleeActions } ]

- type: megafaunaSelector
  id: ORTRanged
  selector: !type:AllMegafaunaSelector
    children: [ { id: PickTargetSimple }, { id: ORTRangedActions } ]

- type: megafaunaSelector
  id: MercuryActions
  selector: !type:GroupMegafaunaSelector
    children:
    - { id: ActionORTEtherDrainSelector }
    - { id: ActionORTPlanktonFloodSelector }
    - { id: ActionORTCosmicRaysSelector }
    - { id: ActionORTResonanceVerticalSelector }
    - { id: ActionORTResonanceHorizontalSelector }

- type: megafaunaSelector
  id: UFOActions
  selector: !type:GroupMegafaunaSelector
    children:
    - { id: ActionORTEnergyDischargeSelector }
    - { id: ActionGalacticaSupercellSelector }
    - { id: ActionORTEnergySurgeSelector }

- type: megafaunaSelector
  id: ORTMeleeActions
  selector: !type:GroupMegafaunaSelector
    children:
    - { id: ActionORTSolarStormSelector }
    - { id: ActionORTParadigmInflationSelector }
    - { id: ActionORTPhaseConversionSelector }
    - { id: ActionORTReflectiveThreadsSelector }

- type: megafaunaSelector
  id: ORTRangedActions
  selector: !type:GroupMegafaunaSelector
    children:
    - { id: ActionORTEtherDrainSelector }
    - { id: ActionORTEnergyDischargeSelector }
    - { id: ActionORTEnergySurgeSelector }
    - { id: ActionORTPhaseConversionSelector }
    - { id: ActionORTDarkMatterShellSelector }
    - { id: ActionORTConvergenceSelector }
    - { id: ActionORTResonanceVerticalSelector }

- type: megafaunaSelector
  id: ActionORTEtherDrainSelector
  selector: !type:PerformActionSelector
    delay: !type:AngerNumberSelector { range: "1.0,4.0", inverse: true }
    actionId: ActionORTEtherDrain
    conditions: [ !type:ActionAvailableCondition { actionId: ActionORTEtherDrain } ]
