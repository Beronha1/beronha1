# Whiskey-native Cargo integration. Entries are component-based so future
# boss-derived content can opt in without changing the bounty prototypes.

- type: cargoBounty
  id: BountyMegafaunaRawSamples
  reward: 18000
  description: bounty-description-megafauna-raw-samples
  group: StationBounty
  idPrefix: EXO
  entries:
  - name: bounty-item-megafauna-raw-sample
    amount: 8
    whitelist:
      components: [ MegafaunaRawSample ]

