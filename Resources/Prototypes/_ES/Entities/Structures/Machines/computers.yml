# Base Prototypes
- type: entity
  parent: BaseStructure
  id: ESBaseComputerTerminal
  name: computer
  placement:
    mode: SnapgridCenter
  abstract: true
  components:
  - type: Sprite
    drawdepth: Objects
    sprite: Structures/Machines/computers.rsi
    noRot: true
    layers:
    - map: ["computerLayerBody"]
      sprite: _ES/Structures/Machines/computer.rsi
      state: terminal
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: generic
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ComputerVisuals.Powered:
        computerLayerScreen:
          True: { visible: true, shader: unshaded }
          False: { visible: false }
        computerLayerKeys:
          True: { visible: true, shader: unshaded }
          False: { visible: true, shader: shaded }
      enum.WiresVisuals.MaintenancePanelState:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: false }
          False: { visible: true }
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.35,0.25,0.35"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: LitOnPowered
  - type: PointLight
    radius: 1.4
    energy: 40
    curveFactor: 1.0
  - type: EmitSoundOnUIOpen
    sound:
      collection: Keyboard
      params:
        volume: -1
        variation: 0.10
        pitch: 1.10  # low pitch keyboard sounds feel kinda weird
    blacklist:
      tags:
      - NoConsoleSound
  - type: InteractionOutline
  - type: Rotatable
  - type: Anchorable
    flags:
    - Anchorable
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: GlassSmash
  - type: Computer
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: ExtensionCableReceiver
  - type: ActivatableUIRequiresPower
  - type: LightningTarget
    priority: 1
  - type: RequireProjectileTarget
  - type: Electrified
    enabled: false
    usesApcPower: true
  - type: WiresPanel
  - type: WiresVisuals
  - type: Wires
    boardName: wires-board-name-computer
    layoutId: Computer
  - type: ContainerContainer
    containers:
      board: !type:Container

# Anomaly Console
- type: entity
  id: ESBaseComputerAnomaly
  name: anomaly probe console
  description: A console that synchronizes with the science team's resonators to provide data on portal anomalies across the station.
  abstract: true
  suffix: ES
  components:
  - type: ESAnomalyConsole
  - type: ActivatableUI
    key: enum.ESAnomalyConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ESAnomalyConsoleUiKey.Key:
        type: ESAnomalyConsoleBui
  - type: Computer
    board: ESComputerAnomalyCircuitBoard
  - type: PointLight
    color: "#aa4fc7"

- type: entity
  parent: [ ESBaseComputerAnomaly, ESBaseComputerTerminal ]
  id: ESComputerAnomaly
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      sprite: _ES/Structures/Machines/computer.rsi
      state: terminal
    - map: ["computerLayerKeyboard"]
      state: tech_key_off
    - map: ["computerLayerScreen"]
      state: artifact
    - map: ["computerLayerKeys"]
      state: tech_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open

- type: entity
  parent: ESBaseComputerTerminal
  id: ESBaseComputerTerminalTelesci
  name: telescience terminal
  description: A hefty terminal that controls the advanced portal generator in the heart of science.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      sprite: _ES/Structures/Machines/computer.rsi
      state: terminal
    - map: ["computerLayerKeyboard"]
      state: teleport_key_off
    - map: ["computerLayerScreen"]
      state: teleport
    - map: ["computerLayerKeys"]
      state: teleport_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: ESPortalGeneratorConsole
  - type: PointLight
    color: "#0099ff"
  - type: ActivatableUI
    key: enum.ESPortalGeneratorConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ESPortalGeneratorConsoleUiKey.Key:
        type: ESPortalGeneratorConsoleBui
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface

- type: entity
  parent: ESBaseComputerTerminal
  id: ESBaseComputerTerminalNavigation
  name: navigation terminal
  description: Keep going and take the next left.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      sprite: _ES/Structures/Machines/computer.rsi
      state: terminal
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      sprite: _ES/Structures/Machines/computer.rsi
      state: navigation
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: ESRadstormModifierMachine
    modifier: 0.13
    disableAnnouncement: es-radstorm-power-on-navigation-console
    enableAnnouncement: es-radstorm-power-off-navigation-console
  - type: PointLight
    color: "#1bfff3"
  - type: ApcPowerReceiverBattery
    batteryRechargeRate: 25
  - type: Battery
    netsync: false
    maxCharge: 450
  - type: ExaminableBattery
