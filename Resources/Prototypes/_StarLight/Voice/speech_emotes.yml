- type: emote
  id: Marr
  # Whiskey: o Starlight não dá ícone a estes dois, e no menu radial isso vira
  # botão em branco. Reaproveitei a pegada do felionoid, que já veio no porte.
  icon: { sprite: _Starlight/Actions/felionoid.rsi, state: cat_print }
  name: chat-emote-name-marr
  category: Vocal
  available: false
  whitelist:
    components:
    - Vocal
  blacklist:
    components:
    - BorgChassis
  chatMessages: ["chat-emote-msg-marr"]
  chatTriggers:
    - marr
    - marr.
    - marr!
    - marr?
    - marrs
    - marrs.
    - marrs!
    - marrs?

