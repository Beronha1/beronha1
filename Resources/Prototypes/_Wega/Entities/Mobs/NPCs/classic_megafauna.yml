# Ported from RedStar PR #111; sprites adapted to Whiskey's existing assets.

- type: entity
  parent: BaseLavalandBossMegaLegion
  id: MobMegaLegionSplitLeft
  name: legion left part
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Lavaland/Mobs/Bosses/64x64.rsi
    layers:
    - map: [enum.DamageStateVisualLayers.Base]
      state: mega_legion_left
  - type: MobThresholds
    thresholds:
      0: Alive
      400: Dead
  - type: LegionSplit
    nextSplit: MobMegaLegionSplitMedium
  - type: LegionBoss
    summonCount: 2

- type: entity
  parent: MobMegaLegionSplitLeft
  id: MobMegaLegionSplitRight
  name: legion right part
  components:
  - type: Sprite
    layers:
    - map: [enum.DamageStateVisualLayers.Base]
      state: mega_legion_right

- type: entity
  parent: MobMegaLegionSplitLeft
  id: MobMegaLegionSplitEye
  name: legion eye
  components:
  - type: Sprite
    layers:
    - map: [enum.DamageStateVisualLayers.Base]
      state: mega_legion_eye

- type: entity
  parent: BaseLavalandBossMegaLegion
  id: MobMegaLegionSplitMedium
  name: medium legion
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Lavaland/Mobs/lavaland_monsters.rsi
    layers:
    - map: [enum.DamageStateVisualLayers.Base]
      state: mega_legion
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Dead
  - type: LegionSplit
    nextSplit: MobMegaLegionSplitSmall
  - type: LegionBoss
    summonCount: 1

- type: entity
  parent: MobMegaLegionSplitMedium
  id: MobMegaLegionSplitSmall
  name: small legion
  categories: [ HideSpawnMenu ]
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: LegionSplit
    nextSplit: null

- type: entity
  parent: MobBloodDrunkMiner
  id: MobBloodDrunkMinerGuidance
  name: blood-drunk miner of Guidance
  suffix: Guidance
  components:
  - type: BloodDrunkMiner
    closedDamage:
      types:
        Slash: 12
        Structural: 35
    openDamage:
      types:
        Slash: 30
        Structural: 75

- type: entity
  parent: MobBloodDrunkMiner
  id: MobBloodDrunkMinerHunter
  name: blood-drunk miner of the Hunter
  suffix: Hunter
  components:
  - type: BloodDrunkMiner
    dashCooldown: 6

- type: entity
  parent: MobBloodDrunkMiner
  id: MobBloodDrunkMinerDoom
  name: blood-drunk miner of Doom
  suffix: Doom
  components:
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.7
    baseSprintSpeed: 3.4
  - type: BloodDrunkMiner
    dashCooldown: 4

- type: entity
  parent: [ LavalandMobBase, MobBloodstream ]
  id: MobLowerAshDrake
  name: ash drake
  description: A lesser draconic form carrying a fraction of the Necropolis guardian's power.
  suffix: Lower
  categories: [ HideSpawnMenu ]
  components:
  - type: Physics
    bodyType: KinematicController
    canCollide: false
  - type: Sprite
    sprite: _Wega/Mobs/Lavaland/ashdrake.rsi
    layers:
    - map: [enum.DamageStateVisualLayers.Base]
      state: dragon
  - type: DamageStateVisuals
    states:
      Alive:
        Base: dragon
      Dead:
        Base: dragon_dead
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bite.ogg
    attackRate: 1
    damage:
      types:
        Slash: 10
  - type: RechargeBasicEntityAmmo
    showExamineText: false
    rechargeCooldown: 0.01
    rechargeSound: null
  - type: BasicEntityAmmoProvider
    proto: BulletAshDrakeFire
    capacity: 9999
    count: 9999
  - type: Gun
    projectileSpeed: 10
    fireRate: 1
    useKey: false
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    showExamineText: false
    soundGunshot: null
    soundEmpty: null
  - type: Pullable
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.25
    baseSprintSpeed: 2.25
  - type: MobThresholds
    thresholds:
      0: Alive
      500: Dead
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 500
    bloodlossDamage:
      types:
        Bloodloss: 0
  - type: Tag
    tags:
    - LavaWalking
