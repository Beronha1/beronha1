- type: entity
  parent: [ BaseItem, BaseMinorContraband ]
  id: WeaponChildishOniBlade
  name: nameless sword
  description: A blade made from countless curses. It is still warm from its owner's last game.
  components:
  - type: Sprite
    sprite: _Lavaland/Objects/Weapons/Melee/nameless_sword.rsi
    state: icon
  - type: Item
    sprite: _Lavaland/Objects/Weapons/Melee/nameless_sword.rsi
    size: Ginormous
  - type: MeleeWeapon
    heavyStaminaCost: 15
    attackRate: 0.75
    damage:
      types:
        Slash: 15
        Heat: 5
        Structural: 50
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Tool
    qualities: [ Prying, Axing, Slicing, Sawing ]
  - type: ToolTileCompatible
  - type: Prying
  - type: Sharp
  - type: Execution
    doAfterDuration: 5
    decapitation: true
  - type: UseDelay
    delay: 1.5
  - type: Scalpel
    speed: 1
  - type: BoneSaw
    speed: 2
  - type: SurgeryTool
    startSound:
      path: /Audio/_Shitmed/Medical/Surgery/saw.ogg
  - type: ActionGrant
    actions: [ ActionChildishOniBladeFlamingSlash ]
  - type: ItemActionGrant
  - type: MegafaunaWeaponLooter

- type: entity
  parent: BaseCrusherUpgradeBlade
  id: TrophyChildishOniHorn
  name: childish oni horn
  description: Sharpens melee attacks with the oni's fury and makes kinetic impacts release a short density wave that throws nearby targets.
  components:
  - type: Sprite
    sprite: _Lavaland/Clothing/Head/Misc/oni.rsi
    state: icon
  - type: GunUpgrade
    name: lavaland-trophy-childish-oni-name
    uniqueGroup: childishOniTrophy
    pipelinePriority: 30
  - type: CrusherTrophy
    trophyId: childish-oni
    capacityCost: 35
  - type: CrusherOniHornUpgrade
  - type: TrophyRecyclable
    loot: !type:AllSelector
      children:
      - id: OniDensityCore
  - type: WeaponUpgradeDamage
    bonusDamage:
      types:
        Slash: 8
        Heat: 4
  - type: GunUpgradeDamage
    bonusDamage:
      types:
        Slash: 8
        Heat: 4
