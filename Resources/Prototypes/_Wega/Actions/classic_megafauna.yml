# Ported from RedStar PR #111/#117 with the original Wega action icons.

- type: entity
  parent: BaseAction
  id: ActionMegaLegion
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    raiseOnUser: true
    useDelay: 1.5
  - type: Sprite
    sprite: _Wega/Mobs/Lavaland/legionskull.rsi
    state: legion_head_1
  - type: TargetAction
    range: 10
  - type: EntityTargetAction
    event: !type:MegaLegionAction

- type: entity
  parent: BaseAction
  id: ActionBloodDrunkMinerDash
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    raiseOnUser: true
    useDelay: 10
  - type: Sprite
    sprite: Interface/Actions/jump.rsi
    state: icon
  - type: TargetAction
    range: 10
  - type: WorldTargetAction
    event: !type:BloodDrunkMinerDashAction

- type: entity
  parent: BaseAction
  id: ActionColossusFraction
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    raiseOnUser: true
    useDelay: 5
  - type: Sprite
    sprite: _Wega/Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    state: throwing_knife
  - type: TargetAction
    range: 12
  - type: EntityTargetAction
    event: !type:ColossusFractionActionEvent

- type: entity
  parent: ActionColossusFraction
  id: ActionColossusCross
  components:
  - type: EntityTargetAction
    event: !type:ColossusCrossActionEvent

- type: entity
  parent: ActionColossusFraction
  id: ActionColossusSpiral
  components:
  - type: EntityTargetAction
    event: !type:ColossusSpiralActionEvent

- type: entity
  parent: ActionColossusFraction
  id: ActionColossusTripleFraction
  components:
  - type: EntityTargetAction
    event: !type:ColossusTripleFractionActionEvent

- type: entity
  parent: BaseAction
  id: ActionAshDrakeConeFire
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    raiseOnUser: true
    useDelay: 8
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    state: fireball
  - type: TargetAction
    range: 12
  - type: EntityTargetAction
    event: !type:AshDrakeConeFireActionEvent

- type: entity
  parent: ActionAshDrakeConeFire
  id: ActionAshDrakeBreathingFire
  components:
  - type: EntityTargetAction
    event: !type:AshDrakeBreathingFireActionEvent

- type: entity
  parent: BaseAction
  id: ActionAshDrakeLava
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    raiseOnUser: true
    useDelay: 20
  - type: Sprite
    sprite: Tiles/Planet/lava.rsi
    state: lava
  - type: TargetAction
    range: 12
  - type: EntityTargetAction
    event: !type:AshDrakeLavaActionEvent
      landingDamage:
        types:
          Blunt: 75
      healingSpec:
        types:
          Blunt: -125
          Slash: -125
