# Behaviour is a native ECS reimplementation. Sprite provenance is recorded in each RSI metadata file.

- type: entity
  parent: BaseSword
  id: WeaponCleavingSaw
  components:
  - type: Sprite
    sprite: _Lavaland/Objects/Weapons/Melee/miner_rewards.rsi
    layers:
    - state: cleaving_saw
      map: [ "base" ]
  - type: Item
    size: Huge
    sprite: _Lavaland/Objects/Weapons/Melee/miner_rewards.rsi
  - type: MeleeWeapon
    attackRate: 2.5
    angle: 30
    autoAttack: true
    damage:
      types:
        Slash: 12
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Tool
    qualities: [ Sawing, Slicing ]
    speedModifier: 1.5
  - type: CleavingSaw
    closedDamage:
      types:
        Slash: 12
    openDamage:
      types:
        Slash: 20
    closedBleed:
      types:
        Bloodloss: 3
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.CleavingSawVisuals.Open:
        base:
          True: { state: cleaving_saw_open }
          False: { state: cleaving_saw }
  - type: StaticPrice
    price: 10000

