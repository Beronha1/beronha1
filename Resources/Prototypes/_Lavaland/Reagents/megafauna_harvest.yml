# Raw carcass fluids. These are intentionally lethal until stabilized by a
# chemist; their industrial and medical value should not make raw injection a
# safe shortcut.

- type: reagent
  id: ExothermicBlood
  name: reagent-name-exothermic-blood
  group: Biological
  desc: reagent-desc-exothermic-blood
  physicalDesc: reagent-physical-desc-viscous
  flavor: metallic
  color: "#e35b24"
  metabolisms:
    Bloodstream:
      effects:
      - !type:AdjustTemperature
        amount: 50000
      - !type:HealthChange
        damage:
          types:
            Heat: 6

- type: reagent
  id: DemonicBlood
  name: reagent-name-demonic-blood
  group: Biological
  desc: reagent-desc-demonic-blood
  physicalDesc: reagent-physical-desc-viscous
  flavor: metallic
  color: "#6d0718"
  metabolisms:
    Bloodstream:
      effects:
      - !type:EvenHealthChange
        damage:
          Brute: 4
          Toxin: 4

- type: reagent
  id: MercuryVenom
  name: reagent-name-mercury-venom
  group: Toxins
  desc: reagent-desc-mercury-venom
  physicalDesc: reagent-physical-desc-metallic
  flavor: bitter
  color: "#79e9ef"
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 6
      - !type:MovementSpeedModifier
        walkSpeedModifier: 0.65
        sprintSpeedModifier: 0.65

- type: reagent
  id: OniGastricEnzymes
  name: reagent-name-oni-gastric-enzymes
