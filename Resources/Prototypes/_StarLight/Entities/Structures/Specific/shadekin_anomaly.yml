# Portado de https://github.com/ss14Starlight/space-station-14
# Só os blocos que o Shadekin usa, extraídos um a um em vez de copiar os
# arquivos inteiros do Starlight, que trariam conteúdo sem relação.

- type: entity
  id: PortalShadekin
  suffix: Dark
  description: The portal to the dark...
  parent: AnomalyShadow
  components:
    - type: Portal
      arrivalSound: /Audio/Items/hiss.ogg
      departureSound: /Audio/Items/hiss.ogg
      canTeleportToOtherMaps: true
      randomTeleport: false
    - type: DarkPortal
    - type: Anomaly
      corePrototype: null
      # Whiskey: o BluespaceCrystal do Starlight puxa material próprio, tipo de
      # pilha, RSI e componente que este fork não tem, tudo para um item que só
      # serve de núcleo inerte. O núcleo de anomalia de sombra daqui é o
      # equivalente temático e já existe.
      coreInertPrototype: AnomalyCoreShadowInert
      minPointsPerSecond: 0
      maxPointsPerSecond: 0
      animationTime: 5
      minPulseLength: 60
      maxPulseLength: 120
      decayhreshold: 0
      deleteEntity: false
      # Whiskey: o AnomalyComponent daqui nao tem particleInteractions nem os
      # dois campos de leitura de particula do scanner. A anomalia continua
      # funcionando, so nao tem a interacao especial de estabilizacao.
    - type: SecretDataAnomaly
      randomStartSecretMin: 2
      randomStartSecretMax: 5
    - type: Sprite
      sprite: _Starlight/Structures/Specific/Anomalies/dark.rsi
      layers:
        - state: portal
          map: ["enum.AnomalyVisualLayers.Base"]
    - type: Fixtures
      fixtures:
        fix1:
          shape: !type:PhysShapeCircle
            radius: 0.35
          density: 50
          mask:
            - FlyingMobMask
          layer:
            - FlyingMobLayer
        portalFixture:
          shape: !type:PhysShapeAabb
            bounds: "-0.25,-0.48,0.25,0.48"
          mask:
            - FullTileMask
          layer:
            - WallLayer
          hard: false
    - type: PointLight
      radius: 3
      energy: 1
      color: "#793a80dd"
    - type: DarkLight
    - type: Shadegen
      range: 5
    - type: AmbientSound
      range: 5
      volume: -5
      sound:
        path: /Audio/Ambience/Objects/gravity_gen_hum.ogg
    - type: Tag
      tags:
        - TheDark
    - type: GuideHelp
      guides:
        - AnomalousResearch
        - Brighteye
        - Shadekin
    - type: EntitySpawnAnomaly
      entries:
        - settings:
            spawnOnPulse: true
            minAmount: 3
            maxAmount: 7
            maxRange: 5
          spawns:
            - DarkRandom
            - ShadekinShadow
        - settings:
            spawnOnSuperCritical: true
            minAmount: 100
            maxAmount: 200
            maxRange: 10
          spawns:
            - DarkRandom
        - settings:
            spawnOnShutdown: true
            maxAmount: 1
            maxRange: 1
          spawns:
            - AdminInstantEffectFlash

- type: entity
  id: ShadekinTrapSpawn
  placement:
    mode: SnapgridCenter
  components:
    - type: Sprite
      sprite: _Starlight/Structures/Specific/Anomalies/dark.rsi
      noRot: true
      layers:
        - state: darktrap-spawn
          shader: unshaded
    - type: Physics
      bodyType: Static
      fixedRotation: true
      canCollide: false
    - type: Transform
      anchored: true
    - type: TimedSpawner
      prototypes:
        - ShadekinTrap
      intervalSeconds: 2
    - type: Tag
      tags:
        - HideContextMenu
