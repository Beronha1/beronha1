- type: entity
  parent: BaseItem
  id: SpiderMercuryCore
  components:
  - type: Sprite
    sprite: _Lavaland/Objects/Devices/mercury.rsi
    state: mercury_core
  - type: PointLight
    radius: 2
    energy: 1.5
    color: "#22ddff"
  - type: Tag
    tags: [ SpiderMercuryCore ]
  - type: ResearchArtifact
    points: 5000
    technologies: [ MercuryORTApplications ]
  - type: StaticPrice
    price: 6500
  - type: Construction
    graph: SpiderMercuryCoreConstructionGraph
    node: mercuryCore
  - type: MegafaunaProvenance
    source: megafauna-source-mercury-spider
    grade: Intact
  - type: MegafaunaIntactSample

- type: entity
  parent: BaseWeaponBatterySmall
  id: WeaponSpiderMercuryRailgun
  components:
  - type: Sprite
    sprite: _Lavaland/Objects/Weapons/mercury_railgun.rsi
    state: icon
  - type: Item
    sprite: _Lavaland/Objects/Weapons/mercury_railgun.rsi
    size: Ginormous
    shape:
    - 0,0,3,1
  - type: Gun
    projectileSpeed: 40
    fireRate: 0.35
    soundGunshot:
      path: /Audio/_Goobstation/Weapons/Guns/Gunshots/plasma_cutter.ogg
  - type: BatteryAmmoProvider
    proto: BulletSpiderMercuryRailgun
    fireCost: 100
  - type: BatterySelfRecharger
    autoRechargeRate: 33.34
  - type: Construction
    graph: SpiderMercuryRailgunConstructionGraph
    node: railgun

- type: entity
  parent: BulletKinetic
  id: BulletSpiderMercuryRailgun
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Lavaland/Effects/plankton.rsi
    layers:
    - state: plankton_projectile
    drawdepth: Effects
  - type: Projectile
    damage:
      types:
        Blunt: 20
        Radiation: 15
        Structural: 200
  - type: TimedDespawn
    lifetime: 0.6

- type: entity
  parent: BaseCrusherUpgradeBlade
  id: TrophySpiderMercuryAlloy
  name: adaptive mercury alloy
  description: An impossible alloy that adds heat and radiation to attacks and makes kinetic bolts ricochet once into another living target.
  components:
  - type: Sprite
    sprite: _Lavaland/Objects/Materials/mercury.rsi
    state: radiant
  - type: GunUpgrade
    name: lavaland-trophy-spider-mercury-name
    uniqueGroup: spiderMercuryTrophy
    pipelinePriority: 20
  - type: CrusherTrophy
    trophyId: mercury-spider
    capacityCost: 40
  - type: CrusherMercuryAlloyUpgrade
  - type: TrophyRecyclable
    loot: !type:AllSelector
      children:
      - id: SpiderMercuryCore
  - type: WeaponUpgradeDamage
    bonusDamage:
      types:
        Heat: 10
        Radiation: 5
  - type: GunUpgradeDamage
    bonusDamage:
      types:
        Heat: 10
        Radiation: 5
