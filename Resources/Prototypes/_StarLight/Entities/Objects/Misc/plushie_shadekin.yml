# Pelúcia de Shadekin, decoração do esconderijo.

- type: entity
  parent: BasePlushie
  id: BaseShadekinPlushie
  abstract: true
  components:
  - type: EmitSoundOnUse
    sound:
      path: /Audio/_Starlight/Voice/Shadekin/mar.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Starlight/Voice/Shadekin/mar.ogg
  - type: EmitSoundOnActivate
    sound:
      path: /Audio/_Starlight/Voice/Shadekin/mar.ogg
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/_Starlight/Voice/Shadekin/mar.ogg
  - type: MeleeWeapon
    wideAnimationRotation: 180
    soundHit:
      path: /Audio/_Starlight/Voice/Shadekin/wurble.ogg
  - type: Edible
    requiresSpecialDigestion: true
    useSound:
      path: /Audio/_Starlight/Voice/Shadekin/scream_f1.ogg
  - type: FoodSequenceElement
    entries:
      CottonBurger: PlushieShadekin

- type: entity
  parent: BaseShadekinPlushie
  id: PlushieShadekin
  name: shadekin plushie
  description: A plushie of a Shadekin. It's very soft.
  components:
  - type: Item
    size: Small
    sprite: _Starlight/Objects/Fun/Plushies/shadekin_plushie.rsi
  - type: Sprite
    sprite: _Starlight/Objects/Fun/Plushies/shadekin_plushie.rsi
    state: icon
  - type: FoodSequenceElement
    entries:
      CottonBurger: PlushieShadekin
