#
# Whiskey: o SubRule do Starlight equivale ao NestedRule daqui, e o campo mapTag
# do LoadMapRule não existe neste fork, então quem põe a marca no mapa é o
# MarcarMapaCarregado, que faz a mesma coisa pelo evento RuleLoadedGridsEvent.

- type: entity
  parent: BaseGameRule
  id: TheDarkMap
  components:
  - type: StationEvent
  - type: NestedRule
    rules: !type:GroupSelector
      children:
      - id: TheDarkHideoutSpawn
      - id: TheDarkGardenSpawn

- type: entity
  parent: BaseGameRule
  id: TheDarkHideoutSpawn
  components:
  - type: LoadMapRule
    mapPath: /Maps/_StarLight/TheDark/Hideout.yml
  - type: MarcarMapaCarregado
    marca: TheDark

- type: entity
  parent: BaseGameRule
  id: TheDarkGardenSpawn
  components:
  - type: LoadMapRule
    mapPath: /Maps/_StarLight/TheDark/Garden.yml
  - type: MarcarMapaCarregado
    marca: TheDark

# A regra do antagonista. O SubRule do Starlight vira NestedRule, e saíram o
# SubGamemodes com RailroadingBrighteye, que é do sistema de tarefas do
# Starlight, e o AntagLoadProfileRule ficou sem o loadout de roupa.
- type: entity
  abstract: true
  parent: BaseGameRule
  id: BaseBrighteyeRule
  components:
  - type: GameRule
    minPlayers: 20
    cancelPresetOnTooFewPlayers: false
  - type: RuleGrids
  - type: BrighteyeRule
  - type: NestedRule
    rules: !type:GroupSelector
      children:
      - id: TheDarkHideoutSpawn
      - id: TheDarkGardenSpawn
  - type: AntagLoadProfileRule
    speciesHardOverride: Shadekin
  - type: AntagObjectives
    objectives:
    - BrighteyeSurviveObjective
    - BrighteyePortalObjective
  - type: DynamicRuleCost
    cost: 125

- type: entity
  parent: [BaseBrighteyeRule, BaseRoundstartAntagRule]
  id: SubBrighteye
  components:
  - type: AntagSelection
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: Brighteye
      playerRatio: 65
      range:
        min: 1
        max: 3

- type: entity
  parent: [BaseBrighteyeRule, BaseAntagGhostRoleRule]
  id: BrighteyeSpawn
  components:
  - type: StationEvent
    weight: 1
    earliestStart: 10
    reoccurrenceDelay: 20
    minimumPlayers: 20
    duration: null
  - type: AntagSelection
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: Brighteye
      playerRatio: 75
      range:
        min: 1
        max: 2
