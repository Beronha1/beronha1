- type: entity
  abstract: true
  parent: [SolutionFood, SolutionToolSmall, Clothing]
  id: ClothingHandsBase
  components:
  - type: Sprite
    state: icon
  - type: Clothing
    slots: [gloves]
  # Goobstation edit start
    equipSound:
      path: /Audio/_Goobstation/Items/handling/generic_equip2.ogg
      params:
        volume: -4
  # Goobstation edit end
  - type: Edible
    requiresSpecialDigestion: true
  - type: Item
    size: Small
    storedRotation: -90
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15
        reagents:
        - ReagentId: Fiber
          Quantity: 15
      stain: # Ganimed-Port: стайны (funky-station/forky-station#107)
        maxVol: 5
  - type: Tag
    tags:
    - ClothMade
    - WhitelistChameleon
  - type: DamageOnInteractProtection
    damageProtection:
      flatReductions:
        Heat: 5 # the average lightbulb only does around four damage!
  - type: Armor # provide minimal covering to your hands
    coverage:
    - Hand
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95
  # Ganimed-Port-Start: стайны (funky-station/forky-station#107)
  - type: Appearance
  - type: Stainable
    clothingVisuals:
      gloves:
      - sprite: _Funkystation/Effects/blood.rsi
        state: gloveblood
    iconVisuals:
    - sprite: _Funkystation/Effects/blood.rsi
      state: glovebloodicon
  # Ganimed-Port-End

- type: entity
  abstract: true
  parent: [ClothingHandsBase, BaseSlicingRefinable]
  id: ClothingHandsButcherable
  components:
  - type: ToolRefinable
    refineResult:
    - id: MaterialCloth1
  - type: PhysicalComposition # 50% of the amount of cloth you'd obtain upon butchering
    materialComposition:
      Cloth: 50
  - type: Tag
    tags:
    - ClothMade
    - Recyclable
    - WhitelistChameleon

# gloves that cover the fingertips and have synthetic fibers
- type: entity
  abstract: true
  parent: ClothingHandsButcherable
  id: ClothingHandsGlovesSyntheticBase
  components:
  - type: Fiber
    fiberMaterial: fibers-synthetic
  - type: FingerprintMask

- type: entity
  abstract: true
  parent: BaseItem
  id: RingBase
  components:
  - type: Clothing
    slots: [ gloves, neck ]
  - type: Sprite
    sprite: Clothing/Hands/Rings/basic.rsi
  - type: Appearance
  - type: Item
    size: Tiny
  - type: Tag
    tags:
    - Ring

- type: entity
  abstract: true
  id: GoldRingBase
  components:
  - type: StaticPrice
    price: 300

- type: entity
  abstract: true
  id: SilverRingBase
  name: silver ring
  description: Looks slightly less valuable than a gold one.
  components:
    - type: PhysicalComposition
      materialComposition:
        Silver: 200 # 2 bars
    - type: StaticPrice
      price: 275
