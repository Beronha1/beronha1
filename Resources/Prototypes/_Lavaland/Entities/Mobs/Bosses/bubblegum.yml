- type: entity
  name: Bubblegum
  id: LavalandBossBubblegum
  parent: LavalandMobBase
  description: In what passes for a hierarchy among slaughter demons, this one is king.
  components:
  - type: Physics
    bodyType: KinematicController
  - type: Clickable
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1,-2,1,1"
        density: 1000
        mask:
        - LargeMobMask
        layer:
        - LargeMobLayer
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: Sprite
    drawdepth: Mobs
    sprite: _Lavaland/Mobs/Bosses/96x96.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: bubblegum
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    soundHit:
      path: /Audio/Effects/demon_attack1.ogg
    animation: WeaponArcBite
    damage:
        types:
          Piercing: 15
          Slash: 15
          Blunt: 15
          Structural: 200
  - type: Tag
    tags:
    - CannotSuicide
    - FootstepSound
  - type: CombatMode
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 4
  - type: MobThresholds
    thresholds:
      0: Alive
      2500: Dead
  - type: Damageable
    damageModifierSet: Hierophant
  - type: Injurable
    damageContainer: Inorganic
  - type: FootstepModifier
    footstepSoundCollection:
      collection: BossImpactFootstep
      params:
        volume: -5
  - type: TileMovement
  - type: BossMusic
    soundId: Bubblegum
  - type: Aggressive # also required component for aggro checking
    forgiveRange: 20.0
  - type: MegafaunaDirector
  - type: MegafaunaSpecialAttackOnly
  - type: BubblegumBoss
    # Keep the harvestable body in the normal encounter. The optional second-life
    # arena deletes the first body and is not part of the default progression.
    enableSecondLife: false
    rewards:
    - LavalandCrateNecropolisBubblegumFilled
    bloodHandDamage:
      types:
        Blunt: 10
    enragedBloodHandDamage:
      types:
        Blunt: 20
    phase1Actions:
    - ActionBubblegumTripleDash
    phase1Chances:
      ActionBubblegumTripleDash: 1
    phase2Actions:
    - ActionBubblegumIllusionDash
    - ActionBubblegumPentagramDash
    - ActionBubblegumChaoticIllusionDash
    phase2Chances:
      ActionBubblegumIllusionDash: 0.67
      ActionBubblegumPentagramDash: 0.33
      ActionBubblegumChaoticIllusionDash: 0.75
  - type: NPCUseActionsOnTarget
    recentActionMemory: 4
    actionIds:
    - ActionBubblegumTripleDash
  - type: MegafaunaHarvestable
    completionCarcass: BubblegumResidualCarcass
    stages:
    - name: megafauna-harvest-stage-bubblegum-blood
      toolQualities: [ Slicing ]
      duration: 10
      loot: !type:AllSelector
        children:
        - id: FoodDemonicChewingGum
          rolls: 2
    - name: megafauna-harvest-stage-bubblegum-tissue
      toolQualities: [ Sawing ]
      duration: 12
      loot: !type:AllSelector
        children:
        - id: FoodDemonicChewingGum
          rolls: 3
  - type: SpawnLootOnDeath
    specialTable: !type:AllSelector
      children:
      - id: TrophyLavalandBubblegumDemonClaws
    weaponWhitelist:
      components:
      - MegafaunaWeaponLooter

- type: entity
  id: LavalandBossBubblegumSecondLife
  parent: LavalandBossBubblegum
  name: Bubblegum, unbound
  description: Its destroyed body was only a door. Here, in its private blood-soaked arena, the slaughter demon is fully enraged.
  categories: [ HideSpawnMenu ]
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      750: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 5
    baseSprintSpeed: 5
  - type: BubblegumBoss
    secondLife: true
  - type: NPCUseActionsOnTarget
    recentActionMemory: 4
    actionIds:
    - ActionBubblegumIllusionDash
    - ActionBubblegumPentagramDash
    - ActionBubblegumChaoticIllusionDash
