# Portado de https://github.com/ss14Starlight/space-station-14
#
# Whiskey: o LanguagePrototype daqui só tem id, obfuscation e speech. Saíram o
# icon e o chatPrefix, que este fork não tem, e saiu o fontId Lymphatic, porque
# essa fonte não existe aqui e fonte faltando vira quadradinho na tela.

- type: language
  id: Marish
  speech:
    color: "#be3cc5"
  obfuscation:
    !type:SyllableObfuscation
    minSyllables: 1
    maxSyllables: 2
    replacement:
    - mar
    - mwrrr
    - maaAr
    - aarrr
    - wrurrl
    - mmar

# Whiskey: aqui conhecimento de idioma é entidade própria, uma por idioma, e o
# sistema de conhecimento tenta criar todas ao montar o personagem. Sem esta
# entidade, o spawn de QUALQUER cargo estoura com
# "invalid prototype: LanguageMarish". Molde: _Trauma/Entities/Knowledge/language.yml
- type: entity
  parent: BaseLanguageKnowledge
  id: LanguageMarish
  components:
  - type: LanguageKnowledge
    languageId: Marish
