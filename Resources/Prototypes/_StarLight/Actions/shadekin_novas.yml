#
# Habilidades acrescentadas pela Whiskey, para o Shadekin comum ter decisão
# ativa e não só sofrer ou se curar conforme onde está.

- type: entity
  id: ShadekinApagarLuzAction
  # Whiskey: em prototype de entidade o name e texto literal, nao chave de
  # locale. A traducao vem por ent-<Id> em Resources/Locale.
  name: Snuff Out
  description: Reach out and kill the nearest lit bulb. The dark is where you heal.
  categories: [HideSpawnMenu]
  components:
    - type: Action
      useDelay: 45
      itemIconStyle: BigItem
    - type: Sprite
      sprite: _Starlight/Interface/Actions/shadekin32.rsi
      state: phase_shift
    - type: InstantAction
      event: !type:ApagarLuzActionEvent
