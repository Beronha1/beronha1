- type: entity
  id: BloodBoil
  parent: BaseBullet
  name: Blood Boil
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Sunrise/BloodCult/Weapons/projectiles.rsi
    layers:
    - state: bullet
  - type: Projectile
    damage:
      types:
        Heat: 10
        Blunt: 10
  - type: PointLight
    enabled: true
    color: "#ff4300"
    radius: 2.0
    energy: 7.0
  - type: BloodBoilProjectile
  - type: TimedDespawn
    lifetime: 50

- type: entity
  id: BloodBolt
  parent: BaseBullet
  name: Blood
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Sunrise/BloodCult/Weapons/projectiles.rsi
    layers:
    - state: blood_bolt
  - type: Projectile
    damage:
      types:
        Heat: 0
  - type: BloodBolt
    damage:
      types:
        Blunt: 25
    healConstruct:
      types:
        Blunt: -30
        Heat: -30
        Poison: -30
    unholyVolume: 8
  - type: PointLight
    enabled: true
    color: "#ff0000"
    radius: 3.0
    energy: 3.0
  - type: TimedDespawn
    lifetime: 10
