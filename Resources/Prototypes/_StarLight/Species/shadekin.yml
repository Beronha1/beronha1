# Portado de https://github.com/ss14Starlight/space-station-14
#
# Whiskey: o Starlight descreve a aparência da espécie com speciesBaseSprites,
# markingPoints e humanoidBaseSprite. Nenhum dos três existe neste fork, porque
# aqui o sprite mora no órgão e o limite de marcação virou markingsGroup.
# Molde seguido: Resources/Prototypes/Species/human.yml e o markingsGroup Human.

- type: species
  id: Shadekin
  name: species-name-shadekin
  roundStart: true
  prototype: MobShadekin
  dollPrototype: AppearanceShadekin
  skinColoration: Hues
  defaultSkinTone: "#ffffff"
  maleFirstNames: names_shadekin
  femaleFirstNames: names_shadekin
  naming: First
  # Whiskey: o Vocal daqui não mapeia som por sexo; quem faz isso é este campo.
  # A ordem e masculino, feminino, sem sexo.
  minAge: 20
  youngAge: 100
  oldAge: 200
  maxAge: 300

- type: markingsGroup
  parent: Undergarments
  id: Shadekin
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
      weight: 1
    enum.HumanoidVisualLayers.FacialHair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ TailShadekin ]
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: true
      default: [ EarsShadekin ]
    enum.HumanoidVisualLayers.HeadSide:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Special:
      limit: 0
      required: false
  # o Starlight marcava estas duas camadas como "segue a pele" pelo
  # humanoidBaseSprite; aqui isso é appearances com matchSkin
  appearances:
    enum.HumanoidVisualLayers.Snout:
      matchSkin: true
    enum.HumanoidVisualLayers.HeadSide:
      matchSkin: true
