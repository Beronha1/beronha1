- type: entity
  parent: BasePlant
  id: CoffeePlants
  name: coffee plant
  components:
  - type: Sprite
    sprite: _NF/Objects/Specific/Hydroponics/coffee.rsi
  - type: PlantData
    name: seeds-coffee-name
    packetPrototype: CoffeeSeeds
    productPrototypes: [ FoodCoffee ]
  - type: Plant
    lifespan: 25
    maturation: 9
    production: 1
    yield: 2
    potency: 5
    growthStages: 5
  - type: PlantHarvest
    harvestRepeat: Repeat
  - type: PlantGrowth
    waterConsumption: 0.60
  - type: PlantChemicals
    chemicals:
      Nutriment:
        min: 2
        max: 8
        potencyDivisor: 16
      Theobromine:
        min: 1
        max: 4
        potencyDivisor: 25
