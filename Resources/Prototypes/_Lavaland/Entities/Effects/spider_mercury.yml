# The UFO-to-Xibalba cinematic chain from Goobstation PR #6542.
- type: entity
  id: SpiderMercuryUfoDeathAnimation
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Sprite
    drawdepth: Mobs
    sprite: _Lavaland/Mobs/Bosses/128x128.rsi
    state: UFO-death
    noRot: true
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/_Lavaland/Mobs/Bosses/Mercury/ufo_death.ogg
  - type: TimedSpawner
    prototypes: [ SpiderMercuryStarCell ]
    intervalSeconds: 12.9
    minimumEntitiesSpawned: 1
    maximumEntitiesSpawned: 1
  - type: TimedDespawn
    lifetime: 13

- type: entity
  id: SpiderMercuryStarCell
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  - type: PointLight
    radius: 5
    energy: 3
    color: gold
  - type: SpriteRotater
    rotationSpeed: 30
    increaseOvertime: true
  - type: FadingIn
    fadeInTime: 4
  - type: Sprite
    drawdepth: BelowMobs
    sprite: _Lavaland/Mobs/Bosses/128x96.rsi
    state: star_cell
  - type: TimedSpawner
    prototypes: [ SpiderMercuryXibalbaWarpIn ]
    intervalSeconds: 8
    minimumEntitiesSpawned: 1
    maximumEntitiesSpawned: 1
  - type: FadingTimedDespawn
    # Leave one scheduler margin after the 8-second TimedSpawner. Equal
    # deadlines can otherwise delete the cinematic before Xibalba is spawned.
    lifetime: 8.1
    fadeOutTime: 4
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/_EinsteinEngines/Effects/Shadowkin/futuristic-teleport.ogg

- type: entity
  id: SpiderMercuryXibalbaWarpIn
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: PointLight
    radius: 5
    energy: 3
    color: cyan
  - type: Sprite
    drawdepth: Mobs
    sprite: _Lavaland/Mobs/Bosses/96x96.rsi
    state: warp_in
    noRot: true
  - type: TimedSpawner
    prototypes: [ MobSpiderMercuryUltimate ]
    intervalSeconds: 1.3
    minimumEntitiesSpawned: 1
    maximumEntitiesSpawned: 1
  - type: TimedDespawn
    lifetime: 1.4
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/_EinsteinEngines/Effects/Shadowkin/futuristic-teleport.ogg

- type: entity
  id: ORTXibalbaGhost
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    sprite: _Lavaland/Mobs/Bosses/96x96.rsi
    state: adapted_melee
    drawdepth: BelowMobs
    noRot: true
  - type: FadingIn
    fadeInTime: 0.5
  - type: TimedDespawn
    lifetime: 0.75
