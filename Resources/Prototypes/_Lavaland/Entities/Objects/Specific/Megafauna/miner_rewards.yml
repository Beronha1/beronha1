- type: entity
  parent: BaseAction
  id: ActionToggleCursedIceBoots
  components:
  - type: Action
    useDelay: 0.5
  - type: Sprite
    sprite: _Lavaland/Clothing/Shoes/cursed_ice_boots.rsi
    layers:
    - state: icon
  - type: InstantAction
    event: !type:ToggleCursedIceBootsActionEvent

- type: entity
  id: DemonicIceTrail
  categories: [ HideSpawnMenu ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    drawdepth: FloorEffects
    sprite: Effects/foam.rsi
    state: foam
    color: "#8eddf0aa"
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      slip:
        hard: false
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        layer:
        - SlipLayer
  - type: Slippery
  - type: StepTrigger
    triggerGroups:
      types: [ SlipTile ]
  - type: TimedDespawn
    lifetime: 6

- type: entity
  id: EffectCrusherIceBlock
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Effects
    sprite: _Goobstation/Wizard/Effects/effects.rsi
    state: ice_cube
  - type: TimedDespawn
    lifetime: 4
