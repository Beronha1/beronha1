# Só os blocos que o Shadekin usa, extraídos um a um em vez de copiar os
# arquivos inteiros do Starlight, que trariam conteúdo sem relação.

- type: damageModifierSet
  id: Shadekin
  coefficients:
      # Whiskey: imunidade a asfixia retirada por decisão da administração.
    Cold: 0.75
    Heat: 1.2
    Cellular: 0.25
      # Whiskey: retirado. O Bloodstream do Shadekin já dobra o sangramento na
      # fonte (1 contra 0,5 do humano), e este 1,35 empilhava por cima, dando
      # 2,7 vezes o humano. Medido em jogo: humano 20, Shadekin 54.
    Shock: 1.25
      # Whiskey: dano extra por radiação retirado por decisão da administração.
