- type: entity
  save: false
  name: Urist McShadow
  # Whiskey: BaseMobSpecies e BaseSpeciesPickupableHuge são do Starlight. Aqui o
  # equivalente é BaseSpeciesMobOrganic, e a aparência entra como pai, igual o
  # MobHuman faz com AppearanceHuman.
  parent: [AppearanceShadekin, MobBloodstream, MobAtmosStandard, MobFlammable, BaseSpeciesMobOrganic]
  id: BaseMobShadekin
  abstract: true
  components:
    # Whiskey: o componente daqui é LanguageSpeaker, com a mesma forma de listas.
    # O comum da estação é TauCetiBasic, não GalacticCommon, e o Empathy é
    # exclusivo do Starlight, então ficou de fora.
    - type: LanguageSpeaker
      speaks:
        - TauCetiBasic
        - Marish
      understands:
        - TauCetiBasic
        - Marish
    - type: Inventory
      speciesId: shadekin
    - type: Shadekin
      thresholds:
        0.8: Low
        5: Annoying
        10: High
        15: Extreme
    - type: Absorbable
    - type: Hunger
    - type: Thirst
    - type: Icon
      sprite: _Starlight/Mobs/Species/Shadekin/parts.rsi
      state: full
    - type: Body # Whiskey: sem campo; quem monta é o InitialBody do AppearanceShadekin
    - type: Speech
      # Whiskey: o Hisses do Starlight tem as mesmas palavras-gatilho do Hiss
      # que este fork já tem, e emote duplicado quebra o chat. Ficou o Hiss daqui.
      allowedEmotes: ["Marr", "Wurble", "Hiss", "Growl", "Purr"]
    - type: Vocal
      # Whiskey: o Vocal daqui nao mapeia por sexo. Quem faz isso e o campo
      # defaultSoundsBySex do species.
    - type: MeleeWeapon
      soundHit:
        collection: AlienClaw
      angle: 30
      animation: WeaponArcClaw
      damage:
        types:
          Slash: 5
    - type: Damageable
      damageModifierSet: Shadekin
    # Whiskey: o damageContainer saiu do Damageable e vive no Injurable,
    # que é do Shitmed. Ver Resources/Prototypes/Body/base_organs.yml.
    - type: Injurable
      damageContainer: Biological
    - type: Deathgasp
      # Whiskey: o Deathgasp daqui nao tem damageType.
    - type: Reactive
      groups:
        Flammable: [Touch]
        Extinguish: [Touch]
        Acidic: [ Touch, Ingestion ]
      reactions:
        - reagents: [Water, SpaceCleaner]
          methods: [Touch]
          effects:
            - !type:WashCreamPie
            - !type:Emote
              emote: Hiss
              showInChat: false
    - type: Bloodstream
      bloodlossDamage:
        types:
          Bloodloss: 1
      bloodlossHealDamage:
        types:
          Bloodloss: -0.25
      bloodReferenceSolution:
        reagents:
          - ReagentId: DarkBlood
            Quantity: 300
    - type: Flammable
      damage:
        types:
          Heat: 1.5
    - type: TypingIndicator
      proto: alien
    - type: PassiveDamage
      allowedStates:
        - Alive
      # Whiskey: o PassiveDamage daqui nao tem damageCap.
      damage:
        # Whiskey: aqui o PassiveDamage so aceita types. Brute e Burn tem 4 tipos
        # cada e o valor de grupo e dividido entre eles, entao -0.07 vira -0.0175
        # por tipo e a cura por segundo fica igual a do original.
        types:
          Blunt: -0.0175
          Slash: -0.0175
          Piercing: -0.0175
          Ballistic: -0.0175
          Heat: -0.0175
          Shock: -0.0175
          Cold: -0.0175
          Caustic: -0.0175
    - type: Destructible
      thresholds:
        - trigger: !type:DamageTypeTrigger
            damageType: Blunt
            damage: 400
          behaviors:
            - !type:GibBehavior {}
            - !type:SpawnEntitiesBehavior
              spawn:
                ShadekinShadow:
                  min: 1
                  max: 1
        - trigger: !type:DamageTypeTrigger
            damageType: Heat
            damage: 1500
          behaviors:
            - !type:SpawnEntitiesBehavior
              spawnInContainer: true
              spawn:
                Ash:
                  min: 1
                  max: 1
                ShadekinShadow:
                  min: 1
                  max: 1
            - !type:BurnBodyBehavior {}

    # BaseMobSpeciesOrganic // Because we dont want respirator to be used.
    - type: Barotrauma
      damage:
        types:
          Blunt: 0.85 #per second, scales with pressure and other constants.
          Heat: 0.1
    - type: Fingerprint
    - type: Blindable
    # Whiskey: DarkenedVision é sobreposição de cliente do Starlight. Nem lá o
    # Shadekin mexia nela, a força nasce zero e nenhum sistema levanta, então
    # ela era inerte de qualquer jeito.
    # Other
    - type: TemperatureDamage
      heatDamageThreshold: 325
      coldDamageThreshold: 260
      coldDamage:
        types:
          Cold: 0.1 #per second, scales with temperature & other constants
      heatDamage:
        types:
          Heat: 1.5 #per second, scales with temperature & other constants
    - type: Temperature
      temperature: 310.15
      specificHeat: 42
    - type: TemperatureSpeed
      thresholds:
        293: 0.8
        280: 0.6
        260: 0.4
    - type: ThermalRegulator
      metabolismHeat: 800
      radiatedHeat: 100
      implicitHeatRegulation: 500
      sweatHeatRegulation: 2000
      shiveringHeatRegulation: 2000
      normalBodyTemperature: 310.15
      thermalRegulationTemperatureThreshold: 2
    - type: Perishable
    - type: Butcherable
      # Whiskey: o Butcherable daqui nao tem butcheringType.
      spawned:
        - id: FoodMeat
          amount: 5
    - type: FireVisuals
      alternateState: Standing
