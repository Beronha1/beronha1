- type: entity
  parent: BaseAction
  id: ActionColossusRoar
  name: Colossus roar
  description: Emit a divine shockwave that disarms and knocks down nearby creatures.
  components:
  - type: Action
    icon:
      sprite: _Wega/Objects/Specific/Lavaland/voicegod.rsi
      state: icon
    useDelay: 1
  - type: InstantAction
    event: !type:ColossusRoarActionEvent

- type: entity
  parent: BaseAction
  id: ActionSacredFlame
  name: Sacred Flame
  description: Ignite yourself and every flammable creature nearby in an inextinguishable-looking burst of draconic fire.
  components:
  - type: Action
    icon:
      sprite: _Wega/Objects/Specific/Lavaland/lavastaff.rsi
      state: icon
    useDelay: 30
  - type: InstantAction
    event: !type:SacredFlameActionEvent
      radius: 4
      severity: 0.45

- type: entity
  parent: BaseAction
  id: ActionDensitySurge
  name: Density surge
  description: Briefly anchor your body against control effects and add knockback to unarmed strikes.
  components:
  - type: Action
    icon:
      sprite: Structures/Specific/Anomalies/Cores/gravity_core.rsi
      state: core
    useDelay: 1
  - type: InstantAction
    event: !type:DensitySurgeActionEvent
