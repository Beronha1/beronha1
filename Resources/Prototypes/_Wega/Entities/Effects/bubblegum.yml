# Ported from RedStar PR #111/#117. The shared landing telegraph uses its
# original Wega media because Ash Drake also relies on it.

- type: entity
  id: EffectMegaFaunaMarker
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: false
  - type: Sprite
    noRot: true
    sprite: _Wega/Effects/effects96x96.rsi
    state: landing
  - type: TimedDespawn
    lifetime: 2

- type: entity
  id: BaseEffectBubblegumHand
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  - type: TimedDespawn
    lifetime: 1.2

- type: entity
  parent: BaseEffectBubblegumHand
  id: EffectBubblegumHandLeft
  components:
  - type: Sprite
    sprite: _Lavaland/Effects/bubblegum_hands.rsi
    state: leftsmack

- type: entity
  parent: BaseEffectBubblegumHand
  id: EffectBubblegumHandRight
  components:
  - type: Sprite
    sprite: _Lavaland/Effects/bubblegum_hands.rsi
    state: rightsmack

- type: entity
  id: EffectBubblegumDashTrail
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Lavaland/Mobs/Bosses/96x96.rsi
    state: bubblegum
    color: "#ffffff66"
  - type: TimedDespawn
    lifetime: 0.4
