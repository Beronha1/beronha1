- type: entity
  abstract: true
  name: Legion
  id: BaseLavalandBossMegaLegion
  parent: LavalandMobBase
  description: One of many.
  components:
  - type: EmitSoundOnSpawn
    sound:
      # The former legion_spawn.ogg had no recorded source or license.
      # invoke_general.ogg is a traced /tg/ asset under CC-BY-SA-3.0.
      path: /Audio/_Lavaland/Effects/invoke_general.ogg
      params:
          volume: 5
          maxDistance: 30
  - type: Physics
    bodyType: KinematicController
  - type: Clickable
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 1000
        mask:
        - LargeMobMask
        layer:
        - LargeMobLayer
  - type: NpcFactionMember
    factions:
    - Lavafauna
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      NavSmash: !type:Bool
        true
  - type: Sprite
    drawdepth: Mobs
    sprite: _Lavaland/Mobs/Bosses/96x96.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: mega_legion
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    soundHit:
      collection: AlienClaw
    animation: WeaponArcBite
    damage:
        types:
          Blunt: 35
          Structural: 200
  - type: Tag
    tags:
    - CannotSuicide
  - type: CombatMode
  - type: MovementSpeedModifier
    baseWalkSpeed: 5
    baseSprintSpeed: 5
  - type: MobThresholds
    thresholds:
      0: Alive
      800: Dead
  - type: Damageable
    damageModifierSet: Hierophant
  - type: Injurable
    damageContainer: Inorganic
  - type: TileMovement
  - type: BossMusic
    soundId: AshDrake
  - type: Aggressive # also required component for aggro checking
    forgiveRange: 20.0
  - type: LegionBoss
    summonCount: 2
    laserDamage:
      types:
        Heat: 55
  - type: MegafaunaSpecialAttackOnly
  - type: NPCUseActionsOnTarget
    actionIds:
    - ActionMegaLegion

- type: entity
  parent: MobLegion
  id: MobLegionLarge
  name: greater legion
  description: A swollen mass of legion fragments forced into one ravenous body.
  categories: [ HideSpawnMenu ]
  components:
  - type: ScaleVisuals
    scale: 1.5, 1.5
  - type: MobThresholds
    thresholds:
      0: Alive
      350: Dead
  - type: MeleeWeapon
    attackRate: 0.65
    damage:
      types:
        Blunt: 28
        Structural: 50
  - type: TimedDespawn
    lifetime: 35

- type: entity
  parent: BaseLavalandBossMegaLegion
  id: LavalandBossMegaLegion
  name: Legion
  components:
  - type: MegafaunaDirector
  - type: MegafaunaHarvestable
    stages:
    - name: megafauna-harvest-stage-legion-skulls
      toolQualities: [ Slicing ]
      duration: 9
      loot: !type:AllSelector
        children:
        - id: MaterialLegionSkull1
          rolls: 5
    - name: megafauna-harvest-stage-legion-core
      toolQualities: [ Sawing ]
      duration: 14
      loot: !type:AllSelector
        children:
        - id: StabilizedLegionCoreImplanter
        - id: StaffOfStorms
  - type: SpawnLootOnDeath
    deleteOnDeath: true
    dropOnDeath: false
    dropBoth: true
    table: !type:AllSelector
      children:
      - id: LavalandCrateNecropolisFilled
    specialTable: !type:AllSelector
      children:
      - id: TrophyLavalandLegionSkull
    weaponWhitelist:
      components:
      - MegafaunaWeaponLooter
