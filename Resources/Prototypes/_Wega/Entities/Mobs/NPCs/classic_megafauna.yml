- type: entity
  parent: BaseLavalandBossMegaLegion
  id: MobMegaLegionSplitLeft
  name: legion left part
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Lavaland/Mobs/Bosses/64x64.rsi
    layers:
    - map: [enum.DamageStateVisualLayers.Base]
      state: mega_legion_left
  - type: MobThresholds
    thresholds:
      0: Alive
      400: Dead
  - type: LegionSplit
    nextSplit: MobMegaLegionSplitMedium
  - type: LegionBoss
    summonCount: 2

- type: entity
  parent: MobMegaLegionSplitLeft
  id: MobMegaLegionSplitRight
  name: legion right part
  components:
  - type: Sprite
    layers:
    - map: [enum.DamageStateVisualLayers.Base]
      state: mega_legion_right

- type: entity
  parent: MobMegaLegionSplitLeft
  id: MobMegaLegionSplitEye
  name: legion eye
  components:
  - type: Sprite
    layers:
    - map: [enum.DamageStateVisualLayers.Base]
      state: mega_legion_eye

- type: entity
  parent: BaseLavalandBossMegaLegion
  id: MobMegaLegionSplitMedium
  name: medium legion
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Lavaland/Mobs/lavaland_monsters.rsi
    layers:
    - map: [enum.DamageStateVisualLayers.Base]
      state: mega_legion
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Dead
  - type: LegionSplit
    nextSplit: MobMegaLegionSplitSmall
  - type: LegionBoss
    summonCount: 1

- type: entity
  parent: MobMegaLegionSplitMedium
  id: MobMegaLegionSplitSmall
  name: small legion
  categories: [ HideSpawnMenu ]
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: LegionSplit
    nextSplit: null

- type: entity
  parent: MobHuman
  id: MobBloodDrunkMiner
  name: blood-drunk miner
  description: An explorer who has survived Lavaland for far too long.
  components:
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: NpcFactionMember
    factions:
    - Lavafauna
  - type: HTN
    rootTask:
      task: SimpleHumanoidHostileCompound
    blackboard:
      NavSmash: !type:Bool
        true
  - type: InputMover
  - type: MobMover
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 4.5
  - type: MobThresholds
    thresholds:
      0: Alive
      900: Dead
  - type: MeleeWeapon
    attackRate: 0.8
    damage:
      types:
        Slash: 25
        Structural: 50
  - type: BasicEntityAmmoProvider
    proto: BulletBloodDrunkMiner
    capacity: 9999
    count: 9999
  - type: Gun
    projectileSpeed: 14
    fireRate: 2
    useKey: false
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/kinetic_accel.ogg
  - type: Loadout
    prototypes:
    - BloodDrunkMinerGear
  - type: BloodDrunkMiner
  - type: MegafaunaDirector
  - type: MegafaunaSpecialAttackOnly
  - type: MegafaunaHarvestable
    stages:
    - name: megafauna-harvest-stage-miner-servos
      toolQualities: [ Screwing ]
      duration: 10
      loot: !type:AllSelector
        children:
        - id: MaterialServoTier4_1
          rolls: 4
        - id: MaterialHighDensityCircuit1
          rolls: 3
    - name: megafauna-harvest-stage-miner-tools
      toolQualities: [ Pulsing ]
      duration: 12
      loot: !type:AllSelector
        children:
        - id: WeaponPlasmaCutterOverclocked
        - id: MaterialTitaniumAlloy1
          rolls: 5
  - type: SpawnLootOnDeath
    deleteOnDeath: true
    dropBoth: true
    table: !type:AllSelector
      children:
      - id: LavalandCrateNecropolisBloodDrunkMinerFilled
    specialTable: !type:AllSelector
      children:
      - id: TrophyLavalandBDMEye
      - id: WeaponWildhunterKnife
    weaponWhitelist:
      components:
      - MegafaunaWeaponLooter
  - type: NPCUseActionsOnTarget
    actionIds:
    - ActionBloodDrunkMinerDash

- type: entity
  parent: MobBloodDrunkMiner
  id: MobBloodDrunkMinerGuidance
  name: blood-drunk miner of Guidance
  suffix: Guidance
  components:
  - type: BloodDrunkMiner
    closedDamage:
      types:
        Slash: 12
        Structural: 35
    openDamage:
      types:
        Slash: 30
        Structural: 75
    meleeHeal:
      types:
        Blunt: -2
        Slash: -2
        Piercing: -2
        Heat: -2

- type: entity
  parent: MobBloodDrunkMiner
  id: MobBloodDrunkMinerHunter
  name: blood-drunk miner of the Hunter
  suffix: Hunter
  components:
  - type: BloodDrunkMiner
    maximumDashRange: 14
  - type: NPCUseActionsOnTarget
    delayModifier: 0.65
    actionIds:
    - ActionBloodDrunkMinerDashHunter

- type: entity
  parent: MobBloodDrunkMiner
  id: MobBloodDrunkMinerDoom
  name: blood-drunk miner of Doom
  suffix: Doom
  components:
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.7
    baseSprintSpeed: 3.4
  - type: BloodDrunkMiner
    maximumDashRange: 16
  - type: NPCUseActionsOnTarget
    delayModifier: 0.55
    actionIds:
    - ActionBloodDrunkMinerDashDoom

- type: startingGear
  id: BloodDrunkMinerGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitShaftMiner
    eyes: ClothingEyesGlassesMeson
    mask: ClothingMaskGasExplorer
    gloves: ClothingHandsGlovesCombat
    shoes: ClothingShoesBootsSalvage
    outerClothing: ClothingOuterHardsuitSalvage
    suitstorage: OxygenTankFilled
  inhand:
  - WeaponCleavingSaw
  - WeaponBloodDrunkKineticAccelerator

- type: entity
  parent: [ LavalandMobBase, MobBloodstream ]
  id: MobLowerAshDrake
  name: ash drake
  description: A lesser draconic form carrying a fraction of the Necropolis guardian's power.
  suffix: Lower
  categories: [ HideSpawnMenu ]
  components:
  - type: Physics
    bodyType: KinematicController
    canCollide: false
  - type: Sprite
    sprite: _Wega/Mobs/Lavaland/ashdrake.rsi
    layers:
    - map: [enum.DamageStateVisualLayers.Base]
      state: dragon
  - type: DamageStateVisuals
    states:
      Alive:
        Base: dragon
      Dead:
        Base: dragon_dead
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bite.ogg
    attackRate: 1
    damage:
      types:
        Slash: 10
  - type: RechargeBasicEntityAmmo
    showExamineText: false
    rechargeCooldown: 0.01
    rechargeSound: null
  - type: BasicEntityAmmoProvider
    proto: BulletAshDrakeFire
    capacity: 9999
    count: 9999
  - type: Gun
    projectileSpeed: 10
    fireRate: 1
    useKey: false
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    showExamineText: false
    soundGunshot: null
    soundEmpty: null
  - type: Pullable
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.25
    baseSprintSpeed: 2.25
  - type: MobThresholds
    thresholds:
      0: Alive
      500: Dead
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 500
    bloodlossDamage:
      types:
        Bloodloss: 0
  - type: Tag
    tags:
    - LavaWalking
