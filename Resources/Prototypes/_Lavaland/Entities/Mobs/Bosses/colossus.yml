- type: entity
  name: Colossus
  id: LavalandBossColossus
  parent: LavalandMobBase
  description: A monstrous creature protected by heavy shielding.
  components:
  - type: Physics
    bodyType: KinematicController
  - type: Clickable
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1,-2,1,1"
        density: 1000
        mask:
        - LargeMobMask
        layer:
        - LargeMobLayer
  - type: NpcFactionMember
    factions:
    - Lavafauna
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      NavSmash: !type:Bool
        true
  - type: Sprite
    drawdepth: Mobs
    sprite: _Wega/Mobs/Lavaland/colossus.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: colossus
  - type: BasicEntityAmmoProvider
    proto: BulletColossus
    capacity: 9999
    count: 9999
  - type: Gun
    projectileSpeed: 4
    fireRate: 10
    useKey: false
    soundGunshot: null
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/demon_attack1.ogg
    damage:
      types:
        Blunt: 20
        Slash: 15
        Structural: 150
  - type: Tag
    tags:
    - CannotSuicide
  - type: CombatMode
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 3
  - type: MobThresholds
    thresholds:
      0: Alive
      2500: Dead
  - type: Damageable
    damageModifierSet: Hierophant
  - type: Injurable
    damageContainer: Inorganic
  - type: Vocalizer
    minVocalizeInterval: 15
    maxVocalizeInterval: 40
    hideChat: true
  - type: DatasetVocalizer
    dataset: ColossusWords
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/_Lavaland/Effects/meteorimpact.ogg
      params:
        volume: 5
  - type: TileMovement
  - type: BossMusic
    soundId: Colossus
  - type: Aggressive # also required component for aggro checking
    forgiveRange: 20.0
  - type: MegafaunaDirector
  - type: MegafaunaSpecialAttackOnly
  - type: ColossusBoss
  - type: MegafaunaHarvestable
    stages:
    - name: megafauna-harvest-stage-colossus-shell
      toolQualities: [ Slicing ]
      duration: 12
      loot: !type:AllSelector
        children:
        - id: MaterialNecroAlloy1
          rolls: 4
        - !type:GroupSelector
          children:
          - id: ColossusAnomalousCrystal
          - id: ColossusAnomalousCrystalReprise
          - id: ColossusAnomalousCrystalRepulsion
          - id: ColossusAnomalousCrystalStasis
          - id: ColossusAnomalousCrystalWard
    - name: megafauna-harvest-stage-colossus-vocal-cords
      toolQualities: [ Sawing ]
      duration: 15
      loot: !type:AllSelector
        children:
        - id: OrganDivineVocalCords
        - id: MaterialNecroAlloy1
          rolls: 2
  - type: SpawnLootOnDeath
    deleteOnDeath: true
    dropBoth: true
    table: !type:AllSelector
      children:
      - id: LavalandCrateNecropolisColossusFilled
    specialTable: !type:AllSelector
      children:
      - id: TrophyLavalandColossusBlasterTubes
    weaponWhitelist:
      components:
      - MegafaunaWeaponLooter
  - type: NPCUseActionsOnTarget
    delayModifier: 0.5
    recentActionMemory: 3
    actionIds:
    - ActionColossusFraction
    - ActionColossusCross
    - ActionColossusSpiral
    - ActionColossusWrath
    actionChances:
      ActionColossusFraction: 0.6
      ActionColossusCross: 0.4
      ActionColossusSpiral: 0.6
      ActionColossusWrath: 0.4
