# Pair medicines. Each one combines the healing domains of two stabilized boss
# products. Pair reactions are heat-gated so four intermediates can coexist at
# room temperature long enough to form Megafauna Polyserum.

- type: reagent
  id: ExothermicRegenerativeSuspension
  name: reagent-name-exothermic-regenerative-suspension
  group: Medicine
  desc: reagent-desc-exothermic-regenerative-suspension
  physicalDesc: reagent-physical-desc-glowing
  flavor: medicine
  color: "#dc5e45"
  worksOnTheDead: true
  reactiveEffects:
    Acidic:
      methods: [ Touch ]
      effects:
      - !type:HealthChange
        scaling: true
        ignoreResistances: false
        ignoreBlockers: false
        damage:
          types:
            Blunt: -2
            Slash: -2
            Piercing: -2
            Heat: -2
            Cold: -2
            Shock: -2
            Caustic: -2
  metabolisms:
    Bloodstream:
      effects:
      - !type:EvenHealthChange
        damage:
          Brute: -4
          Burn: -4

