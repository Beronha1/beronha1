# Pisos dos mapas da escuridão. Sem eles o carregador do mapa estoura com
# KeyNotFoundException no tilemap, antes mesmo de olhar as entidades.

- type: tile
  id: FloorDarkWood
  name: tiles-dark-wood
  sprite: /Textures/_Starlight/Tiles/darkwood.png
  variants: 4
  placementVariants:
  - 1.0
  - 1.0
  - 1.0
  - 1.0
  baseTurf: Plating
  isSubfloor: false
  deconstructTools: [ Prying ]
  footstepSounds:
    collection: FootstepWood
  barestepSounds:
    collection: BarestepWood
  itemDrop: FloorTileItemWood
  heatCapacity: 10000

